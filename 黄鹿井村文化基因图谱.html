<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青州黄鹿井村传统村落文化基因图谱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23335A66'/%3E%3Ctext x='32' y='42' font-size='26' font-family='serif' fill='%23F4F0E7' text-anchor='middle'%3E%E9%BB%84%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F0E7; --paper-2:#ECE5D6; --ink:#2F3B3A; --muted:#6E6A60;
  --line:#D6CFC1; --accent-1:#335A66; --accent-2:#ADBA96;
  --accent-3:#B5A2BC; --accent-4:#B28282; --brick:#B14E53;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--serif);background:var(--paper);color:var(--ink);line-height:1.75;overflow-x:hidden}

/* ===== 封面：线稿→彩色显影 ===== */
.cover{position:relative;height:100vh;overflow:hidden;background:var(--ink)}
.cover-layer{position:absolute;inset:0}
.cover-layer img{width:100%;height:100%;object-fit:cover;object-position:center 38%}
.cover-sketch img{opacity:.94}
.cover-color{clip-path:inset(0 100% 0 0);animation:reveal 2.6s 1s cubic-bezier(.7,0,.2,1) forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.cover-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,43,42,.45),rgba(31,43,42,.3) 50%,rgba(31,43,42,.6))}
.cover-inner{position:relative;z-index:3;text-align:center;padding:0 6vw;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cover-kicker{font-family:var(--sans);font-size:.8rem;letter-spacing:.55em;color:rgba(244,240,231,.7);margin-bottom:1.5rem;opacity:0;animation:rise 1s .4s forwards}
.cover-title{font-size:clamp(2rem,5.4vw,4rem);font-weight:600;color:#F7F3EA;letter-spacing:.14em;line-height:1.35;opacity:0;animation:rise 1.2s 1.2s forwards}
.cover-sub{margin-top:1rem;font-family:var(--sans);font-size:clamp(.8rem,1.3vw,1rem);color:rgba(244,240,231,.85);letter-spacing:.3em;opacity:0;animation:rise 1.2s 1.6s forwards}
.cover-enter{display:inline-block;margin-top:2.8rem;padding:.8rem 3rem;border:1px solid rgba(247,243,234,.85);color:#F7F3EA;text-decoration:none;letter-spacing:.35em;font-size:.9rem;font-family:var(--sans);opacity:0;animation:rise 1s 2s forwards;transition:background .3s,color .3s}
.cover-enter:hover{background:rgba(247,243,234,.94);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
/* 已移除循环阴影动画：每帧重绘 box-shadow，是持续耗电/掉帧的来源 */
.cover-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);color:rgba(244,240,231,.55);font-size:.7rem;letter-spacing:.4em;font-family:var(--sans);opacity:0;animation:rise 1s 2.4s forwards;z-index:3}

/* ===== 地图导航区 ===== */
.map-section{position:relative;min-height:100vh;background:var(--paper);padding:4rem 1.5rem 5rem}
.map-progress{max-width:1100px;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.map-progress h2{font-size:1.3rem;font-weight:600;letter-spacing:.08em}
.map-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.map-progress .stat{font-family:var(--sans);font-size:.85rem;color:var(--accent-1);letter-spacing:.1em}
.map-progress .stat b{font-size:1.15rem;margin:0 .2rem}
.map-wrap{position:relative;max-width:1100px;margin:0 auto;border:1px solid var(--line);box-shadow:0 4px 16px rgba(47,59,58,.10);background:#e8e2d4}
.map-wrap>img{display:block;width:100%;height:auto}
.point{position:absolute;transform:translate(-50%,-50%);background:none;border:none;cursor:pointer;padding:0}
.dot{display:block;width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:transparent;box-shadow:0 0 0 2px rgba(47,59,58,.35);transition:all .3s}
.point:hover .dot{transform:scale(1.5)}
.point.unlocked .dot{background:var(--accent-2);border-color:var(--accent-2);box-shadow:0 0 0 5px rgba(173,186,150,.35)}
.point.done .dot{background:var(--brick);border-color:var(--brick);box-shadow:0 0 0 5px rgba(177,78,83,.3)}
.point .label{position:absolute;left:50%;top:20px;transform:translateX(-50%);white-space:nowrap;font-family:var(--sans);font-size:.68rem;line-height:1.5;color:var(--ink);background:rgba(244,240,231,.95);padding:.02rem .4rem;border:1px solid rgba(47,59,58,.3);pointer-events:none;transition:background .2s,border-color .2s}
.point:hover .label,.point.active .label{background:#fff;border-color:var(--accent-1)}
.point.lb-up .label{top:auto;bottom:20px}
.map-legend{max-width:1100px;margin:1rem auto 0;font-family:var(--sans);font-size:.75rem;color:var(--muted);display:flex;gap:1.5rem;flex-wrap:wrap}
.map-legend span{display:inline-flex;align-items:center;gap:.4rem}
.map-legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* 点位浮层 */
.map-pop{position:absolute;z-index:20;width:min(300px,80%);background:var(--paper-2);border:1px solid var(--ink);box-shadow:0 10px 36px rgba(31,43,42,.25);display:none}
.map-pop.show{display:block}
.map-pop-head{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line);font-weight:600}
.map-pop-head button{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.map-pop-list{padding:.5rem}
.map-pop-item{display:block;width:100%;text-align:left;padding:.55rem .8rem;background:none;border:none;border-bottom:1px dashed var(--line);cursor:pointer;font-family:var(--serif);font-size:.88rem;color:var(--ink);transition:background .2s}
.map-pop-item:hover{background:rgba(51,90,102,.08)}
.map-pop-item .cnt{float:right;font-family:var(--sans);font-size:.68rem;color:var(--accent-1)}
.map-pop-item.seen{color:var(--accent-2)}

/* ===== 树形目录区 ===== */
.tree-section{max-width:1060px;margin:0 auto;padding:3rem 1.5rem 4rem}
.tree-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
.tree-head h3{font-size:1.15rem;font-weight:600}
.tree-head small{font-family:var(--sans);font-size:.75rem;color:var(--muted);letter-spacing:.1em}
.btn-ghost{font-family:var(--sans);font-size:.78rem;letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--line);padding:.4rem 1rem;cursor:pointer}
.btn-ghost:hover{border-color:var(--accent-1);background:rgba(51,90,102,.06)}
.tree-level-2{display:flex;align-items:center;gap:.7rem;padding:.7rem .4rem;cursor:pointer;font-size:1.05rem;font-weight:600;border-bottom:1px solid var(--line)}
.tree-level-2 .tick{flex:none;width:1.25rem;height:1.25rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink);font-family:var(--sans);font-size:.8rem;transition:background .25s}
.tree-level-2.open .tick{background:var(--ink);color:var(--paper)}
.branch-3{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s;margin-left:.55rem;border-left:1px solid var(--line)}
.branch-3.open{grid-template-rows:1fr}
.branch-3>.branch-inner{overflow:hidden;min-height:0}
.tree-level-3{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;cursor:pointer;font-size:.95rem}
.tree-level-3:hover{color:var(--accent-1)}
.tree-level-3 .tick3{flex:none;width:1rem;height:1rem;border-radius:50%;border:1px solid var(--accent-2);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:.65rem;color:var(--accent-2);transition:background .3s,transform .35s}
.tree-level-3.open .tick3{background:var(--accent-2);color:#fff;transform:rotate(135deg)}
.branch-4{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s;margin-left:1.1rem;border-left:1px dashed var(--line)}
.branch-4.open{grid-template-rows:1fr}
.branch-4>.branch-inner{overflow:hidden;min-height:0}
.tree-level-4{padding:.42rem 1.2rem;cursor:pointer;font-size:.88rem;color:#4a4a42;position:relative;transition:background .2s}
.tree-level-4::before{content:"";position:absolute;left:.15rem;top:50%;transform:translateY(-50%);width:.4rem;height:.4rem;background:var(--accent-4);opacity:.7}
.tree-level-4:hover{color:var(--accent-1);background:rgba(51,90,102,.05)}
.tree-level-4 .cnt{margin-left:.4rem;font-family:var(--sans);font-size:.66rem;color:var(--accent-1);border:1px solid var(--accent-2);padding:0 .35rem;border-radius:8px}

/* ===== 抽屉 ===== */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(31,43,42,.28);opacity:0;pointer-events:none;transition:opacity .4s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(880px,96vw);background:var(--paper-2);box-shadow:-4px 0 18px rgba(31,43,42,.12);transform:translateX(105%);transition:transform .5s;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1.3rem 1.5rem .9rem;border-bottom:1px solid var(--line)}
.drawer-title{font-size:1.08rem;font-weight:600;line-height:1.5}
.drawer-close{flex:none;width:2.1rem;height:2.1rem;border:1px solid var(--line);background:none;cursor:pointer;font-size:1.1rem}
.drawer-body{flex:1;overflow-y:auto;padding:1.2rem 1.5rem 2rem}
.drawer-section-label{font-family:var(--sans);font-size:.72rem;letter-spacing:.3em;color:var(--muted);margin:1.1rem 0 .6rem}
.drawer-count{font-family:var(--sans);font-size:.78rem;color:var(--accent-1);margin-bottom:.8rem}
.drawer.full{width:100vw;box-shadow:none}
.drawer.full .drawer-head{width:100%;max-width:1280px;margin:0 auto;padding:1.5rem 2.2rem 1rem}
.drawer.full .drawer-title{font-size:1.32rem}
.drawer.full .drawer-body{width:100%;max-width:1280px;margin:0 auto;padding:1.4rem 2.2rem 3rem}
@media (max-width:900px){.drawer.full .drawer-head,.drawer.full .drawer-body{padding-left:1.15rem;padding-right:1.15rem}}
.img-grid{display:grid;grid-template-columns:1fr;gap:.9rem}
.img-card{background:rgba(255,255,255,.55);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:border-color .25s}
.img-card:hover{border-color:var(--accent-1)}
.img-card .thumb{width:100%;height:auto;display:block;background:#e8e2d4}
.img-card .fname{font-family:var(--sans);font-size:.66rem;color:var(--muted);padding:.35rem .5rem;word-break:break-all}
.vid-card{background:rgba(255,255,255,.55);border:1px solid var(--line);margin-bottom:.7rem}
.vid-card video{width:100%;display:block;background:#000;max-height:280px}
.vid-card .fname{font-family:var(--sans);font-size:.68rem;color:var(--muted);padding:.4rem .6rem;word-break:break-all}
.doc-card{display:flex;align-items:center;gap:.8rem;padding:.65rem .9rem;background:rgba(255,255,255,.55);border:1px solid var(--line);margin-bottom:.5rem;text-decoration:none;color:inherit;transition:border-color .25s}
.doc-card:hover{border-color:var(--accent-1)}
.doc-type{flex:none;width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:.58rem;font-weight:600;color:#fff}
.doc-type.pdf{background:#B14E53}.doc-type.docx{background:#335A66}.doc-type.xlsx{background:#7a8a5a}
.doc-name{font-family:var(--sans);font-size:.76rem;word-break:break-all}
.doc-hint{font-family:var(--sans);font-size:.66rem;color:var(--muted);margin-top:.15rem}
.doc-preview{margin:.3rem 0 1rem;border:1px solid var(--line);background:rgba(255,255,255,.6);max-height:320px;overflow:auto}
.doc-preview table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:.7rem}
.doc-preview td{border:1px solid #d6cfc1;padding:.22rem .4rem;word-break:break-word}
.doc-preview tr:nth-child(even) td{background:rgba(244,240,231,.5)}
.doc-preview .sheet-name{font-family:var(--sans);font-size:.7rem;padding:.3rem .5rem;background:#e8e2d4;position:sticky;top:0;font-weight:500}
.doc-preview .docx-p{font-family:var(--sans);font-size:.8rem;padding:.3rem .6rem;line-height:1.7}
.img-empty{font-family:var(--sans);font-size:.85rem;color:#a29b8c;padding:1.2rem;border:1px dashed var(--line);text-align:center}
.toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%) translateY(20px);z-index:100;background:#2F3B3A;color:#F4F0E7;font-family:var(--sans);font-size:.8rem;padding:.8rem 1.3rem;max-width:90vw;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(20,28,27,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:2rem}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;background:#fff}
.lightbox-cap{color:#e8e2d4;font-family:var(--sans);font-size:.8rem;margin-top:.8rem}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;width:2.4rem;height:2.4rem;cursor:pointer}
.lb-prev{left:1rem}.lb-next{right:1rem}
.lb-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;width:2.4rem;height:2.4rem;cursor:pointer}
@media (max-width:640px){
  .map-section{padding:2.5rem 1rem 3rem}
  .point .label{font-size:.58rem;padding:0 .28rem}
  .dot{width:13px;height:13px}
  .img-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .cover-color{clip-path:none}
  .cover-inner>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<!-- ===== 封面 ===== -->
<section class="cover">
  <div class="cover-layer cover-sketch"><img src="assets/cover-plaque-mono.jpg" alt=""></div>
  <div class="cover-layer cover-color"><img src="assets/cover-plaque.jpg" alt="黄鹿井村牌楼" fetchpriority="high"></div>
  <div class="cover-veil"></div>
  <div class="cover-inner">
    <div class="cover-kicker">TRADITIONAL VILLAGE · CULTURAL GENE</div>
    <h1 class="cover-title">青州黄鹿井村<br>传统村落文化基因图谱</h1>
    <p class="cover-sub">山地古村落空间与乡土文化数字档案</p>
    <a class="cover-enter" href="#map">进入图谱</a>
  </div>
  <div class="cover-hint">向下探索 · EXPLORE</div>
</section>

<!-- ===== 地图导航 ===== -->
<section class="map-section" id="map">
  <div class="map-progress">
    <h2>村落基因地图</h2>
    <div class="map-right">
      <div class="stat">已解锁 <b id="unlockedCount">0</b> / <span id="totalCount">0</span> 个基因条目</div>
      <button class="btn-ghost" id="resetProgress" type="button">重置进度</button>
    </div>
  </div>
  <div class="map-wrap" id="mapWrap">
    <img src="assets/village-map.jpg" alt="黄鹿井村村落航拍几何图" loading="lazy" decoding="async">
    <div class="map-pop" id="mapPop"><div class="map-pop-head"><span id="popTitle"></span><button id="popClose" type="button">×</button></div><div class="map-pop-list" id="popList"></div></div>
  </div>
  <div class="map-legend">
    <span><i style="border:2px solid #888;background:transparent"></i> 未探索</span>
    <span><i style="background:#ADBA96"></i> 已查看</span>
    <span><i style="background:#B14E53"></i> 该类已全部解锁</span>
  </div>
</section>

<!-- ===== 完整目录（树形） ===== -->
<section class="tree-section">
  <div class="tree-head">
    <h3>完整目录</h3>
    <button class="btn-ghost" id="collapseAll" type="button">一键收起</button>
  </div>
  <div id="tree"></div>
  <p style="margin-top:2rem;font-family:var(--sans);font-size:.75rem;color:var(--muted);letter-spacing:.05em">注：图片点击放大，视频内嵌播放，PDF 新窗口打开，Excel / Word 自动转为网页表格预览；.tif / .heic 已自动跳过。解锁进度保存在本地浏览器。</p>
</section>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer-head"><h3 class="drawer-title" id="drawerTitle"></h3><button class="drawer-close" id="drawerClose" type="button">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" type="button">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" type="button">›</button>
  <div class="lightbox-cap" id="lbCap"></div>

/* ---- 点亮逻辑 ---- */
function refreshProgress(){
  var allKeys=[];
  GROUPS.forEach(function(g){g.keys.forEach(function(k){allKeys.push(k);});});
  var seen=allKeys.filter(function(k){return unlocked.indexOf(k)>=0;});
  document.getElementById('unlockedCount').textContent=seen.length;
  document.getElementById('totalCount').textContent=allKeys.length;
  GROUPS.forEach(function(g){
    var pt=document.getElementById('pt-'+g.id);
    var seenIn=g.keys.filter(function(k){return unlocked.indexOf(k)>=0;}).length;
    pt.classList.remove('unlocked','done');
    if(seenIn===g.keys.length && g.keys.length>0) pt.classList.add('done');
    else if(seenIn>0) pt.classList.add('unlocked');
  });
}
function unlock(key){
  if(unlocked.indexOf(key)<0){
    unlocked.push(key);
    try{localStorage.setItem(STORE_KEY,JSON.stringify(unlocked));}catch(e){}
  }
  refreshProgress();
}

/* ---- 点位浮层 ---- */
var pop=document.getElementById('mapPop'),popTitle=document.getElementById('popTitle'),popList=document.getElementById('popList');
function openPop(g,btn){
  document.querySelectorAll('.point.active').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  popTitle.textContent=g.label;
  popList.innerHTML='';
  g.keys.forEach(function(key){
    var d=DATA[key]||{imgs:[],vids:[],docs:[]};
    var n=(d.imgs||[]).length+(d.vids||[]).length+(d.docs||[]).length;
    var b=document.createElement('button');b.className='map-pop-item';b.type='button';
    if(unlocked.indexOf(key)>=0)b.classList.add('seen');
    b.innerHTML=TITLES[key]+' <span class="cnt">'+n+' 份</span>';
    b.addEventListener('click',function(){
      closePop();
      openDrawer(key);
    });
    popList.appendChild(b);
  });
  pop.classList.add('show');
  var pw=pop.offsetWidth,ph=pop.offsetHeight;
  var px=g.x/100*mapWrap.clientWidth;
  var py=g.y/100*mapWrap.clientHeight;
  var x=px+22;
  if(x+pw>mapWrap.clientWidth-8) x=px-pw-22;
  if(x<8) x=8;
  var y=py-ph/2;
  if(y<8) y=8;
  if(y+ph>mapWrap.clientHeight-8) y=mapWrap.clientHeight-ph-8;
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function closePop(){pop.classList.remove('show');document.querySelectorAll('.point.active').forEach(function(p){p.classList.remove('active');});}
document.getElementById('popClose').addEventListener('click',closePop);
mapWrap.addEventListener('click',function(e){if(!e.target.closest('.point'))closePop();});

function toggle(el){

  if(!br)return;
  var open=br.classList.toggle('open');
  el.classList.toggle('open',open);
  el.querySelector('.tick,.tick3').textContent=open?'−':'+';
}
document.querySelectorAll('.tree-level-2,.tree-level-3').forEach(function(el){

});
document.getElementById('collapseAll').addEventListener('click',function(){

var drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),
    drawerTitle=document.getElementById('drawerTitle'),drawerBody=document.getElementById('drawerBody');
var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap');
var curImgs=[],curIdx=0;
function fname(p){return decodeURIComponent(p.split('/').pop());}
function extOf(p){return p.split('.').pop().toLowerCase();}
function docCls(e){return e==='pdf'?'pdf':(e==='docx'||e==='doc')?'docx':(e==='xlsx'||e==='xls')?'xlsx':'other';}
function docLbl(e){return e==='pdf'?'PDF':(e==='docx'||e==='doc')?'WORD':(e==='xlsx'||e==='xls')?'EXCEL':e.toUpperCase();}
var toastTimer=null;
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},4000);}

function openDrawer(key,full){
  var d=DATA[key]||{imgs:[],vids:[],docs:[]};
  curImgs=d.imgs||[];
  drawerTitle.textContent=TITLES[key]||key;
  drawerBody.innerHTML='';
  var n=(d.imgs||[]).length+(d.vids||[]).length+(d.docs||[]).length;
  var c=document.createElement('div');c.className='drawer-count';
  c.textContent='共 '+n+' 份资料（图 '+(d.imgs||[]).length+' · 视频 '+(d.vids||[]).length+' · 文档 '+(d.docs||[]).length+'）';
  drawerBody.appendChild(c);
  if(!n){drawerBody.innerHTML+='<div class="img-empty">该条目暂无资料</div>';}
  if(d.imgs&&d.imgs.length){
    var lb1=document.createElement('div');lb1.className='drawer-section-label';lb1.textContent='调研照片 / 图纸';drawerBody.appendChild(lb1);
    var grid=document.createElement('div');grid.className='img-grid';
    d.imgs.forEach(function(p,i){
      var card=document.createElement('div');card.className='img-card';
      var im=document.createElement('img');im.className='thumb';im.loading='lazy';im.decoding='async';im.src=p.replace(/\.(jpg|jpeg|png)$/i,'_t.jpg');im.alt=fname(p);im.onerror=function(){this.onerror=null;this.src=p;};
      var fn=document.createElement('div');fn.className='fname';fn.textContent=fname(p);
      card.appendChild(im);card.appendChild(fn);
      card.addEventListener('click',function(){openLb(i);});
      grid.appendChild(card);
    });
    drawerBody.appendChild(grid);
  }
  if(d.vids&&d.vids.length){
    var lb2=document.createElement('div');lb2.className='drawer-section-label';lb2.textContent='影像资料';drawerBody.appendChild(lb2);
    d.vids.forEach(function(p){
      var card=document.createElement('div');card.className='vid-card';
      var v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=p;
      var fn=document.createElement('div');fn.className='fname';fn.textContent=fname(p);
      card.appendChild(v);card.appendChild(fn);drawerBody.appendChild(card);
    });
  }
  if(d.docs&&d.docs.length){
    var lb3=document.createElement('div');lb3.className='drawer-section-label';lb3.textContent='文档资料';drawerBody.appendChild(lb3);
    d.docs.forEach(function(p){
      var e=extOf(p),isPdf=e==='pdf';
      var a=document.createElement('a');a.className='doc-card';a.href=p;
      if(isPdf){a.target='_blank';a.rel='noopener';}
      else{a.setAttribute('download','');a.addEventListener('click',function(){showToast('已开始下载「'+fname(p)+'」，下方已内嵌预览；如需原文件请在下载文件夹中查看。');});}
      var badge=document.createElement('div');badge.className='doc-type '+docCls(e);badge.textContent=docLbl(e);
      var w=document.createElement('div');
      var nm=document.createElement('div');nm.className='doc-name';nm.textContent=fname(p);
      var h=document.createElement('div');h.className='doc-hint';h.textContent=isPdf?'点击新窗口预览':'下方已内嵌预览';
      w.appendChild(nm);w.appendChild(h);
      a.appendChild(badge);a.appendChild(w);drawerBody.appendChild(a);
      if(PREVIEWS[p]){
        var pv=document.createElement('div');pv.className='doc-preview';pv.innerHTML=PREVIEWS[p];
        drawerBody.appendChild(pv);
      }
    });
  }
  drawer.classList.toggle('full',!!full);
  drawer.classList.add('open');
  if(full){overlay.classList.remove('show');}else{overlay.classList.add('show');}
  unlock(key);
}
document.querySelectorAll('.tree-level-4').forEach(function(el){
  el.addEventListener('click',function(){openDrawer(el.getAttribute('data-key'),true);});
});
/* 事件委托：树形是动态渲染的，重新绑定 */

function openLb(i){curImgs=curImgs||[];if(!curImgs.length)return;curIdx=i;lbImg.src=curImgs[i];lbCap.textContent=(i+1)+' / '+curImgs.length+' '+fname(curImgs[i]);lb.classList.add('open');}

document.getElementById('lbNext').addEventListener('click',function(e){e.stopPropagation();openLb((curIdx+1)%curImgs.length);});
lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});

document.getElementById('drawerClose').addEventListener('click',closeDrawer);

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeDrawer();closePop();closeLb();}

  closePop();
  refreshProgress();
  showToast('探索进度已重置，36 个条目回到未解锁状态。');
});

/* 初始化 */
refreshProgress();
</script>
